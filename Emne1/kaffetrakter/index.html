<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>- Kaffetrakter -</title>
    <link rel="stylesheet" href="style.css">
</head>


<body onload="setBrewer()">
    <div class="flexcontainer">
        <div class="header"></div>
        <div class="maincontainer">
            <div class="sidebar">
                <button onclick="powerSwitch()" id="powerbutton">On/Off</button>
                <button onclick="startBrew()" id="startbutton" disabled>Start brewing</button>
                <button onclick ="drainCoffee()" id="drainbutton" disabled>Drain Coffee</button>
                <button onclick="abortBrew()" id="abortbutton" disabled>Abort</button>
                <button onclick="checkStates()">sjekk</button>
            </div>
            <div class="maincontent">
                <div class="canvascontainer">
                    <canvas id="kaffecanvas" width="500" height="500" ></canvas>
                </div>
            </div>
        </div>
        <div class="footer"></div>
    </div>

    <script src="main.js"></script>
</body>

</html>
