<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>- Kaffetrakter -</title>
    <link rel="stylesheet" href="style.css">
</head>


<body onload="setBrewer()">
    <div class="flexcontainer">
        <div class="header"></div>
        <div class="maincontainer">
            <div class="sidebar">
                <button id="powerbutton">On/Off</button>
                <button id="startbutton" disabled>Start brewing</button>
                <button id="drainbutton" disabled>Drain Coffee</button>
                <button id="abortbutton" disabled>Abort</button>
                <button id="logbutton">sjekk</button>
            </div>
            <div class="maincontent">
                <div class="canvascontainer">
                    <canvas id="kaffecanvas" width="500" height="500"></canvas>
                </div>
            </div>
        </div>
        <div class="footer"></div>
    </div>

    <script src="main.js"></script>
</body>

</html>
